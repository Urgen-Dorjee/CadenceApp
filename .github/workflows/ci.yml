name: CI

on:
  push:
    branches: [master, 'ci/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        shell: bash
        run: |
          npm ci
          python -m pip install -r backend/requirements-dev.txt

      - name: Cache FFmpeg
        uses: actions/cache@v4
        with:
          path: resources/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-v3

      - name: Download FFmpeg
        run: npm run setup:ffmpeg

      - name: Type check
        run: npx tsc --noEmit -p tsconfig.json

      - name: Lint
        shell: bash
        run: npm run lint

      - name: Frontend tests
        run: npm test

      - name: Backend tests
        working-directory: backend
        run: python -m pytest -v

      # The built app, clicked through by Playwright: starts, splits a file, plays a video...
      - name: UI smoke tests
        if: runner.os != 'macOS'
        shell: bash
        run: |
          npm run build:frontend
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run --auto-servernum -- npx playwright test -c e2e/playwright.config.ts
          else
            npx playwright test -c e2e/playwright.config.ts
          fi

      - name: Keep the UI test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke-report-${{ matrix.os }}
          path: |
            e2e-report
            e2e-results
          if-no-files-found: ignore
