name: Release

# Push a tag like v2.1.0 (matching "version" in package.json) to test, build and
# publish the Windows installer and the update feed (latest.yml) to this
# repository's Releases. Installed copies of Cadence update from there.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches package.json
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $version"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install -r backend/requirements-dev.txt

      - name: Download FFmpeg, Deno and fpcalc
        run: |
          npm run setup:ffmpeg
          npm run setup:deno
          npm run setup:chromaprint

      - name: Test
        run: |
          npx tsc --noEmit -p tsconfig.json
          npm test
          cd backend
          python -m pytest -q

      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional code signing: add these repository secrets to sign the installer.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: npm run release
