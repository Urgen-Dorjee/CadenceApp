ShortDescription: Split YouTube jukeboxes into tagged songs, and save whole videos, playlists and courses.
Description: |-
  Cadence is a free, open-source YouTube downloader for music and video. Paste a jukebox, movie album or singer
  collection and it finds where every song starts, cuts in the gap between songs, then tags and files each one
  with its cover art. It also saves whole videos, playlists and courses with subtitles and chapters, and has a
  music library and a video player. It can split audio and video files from your computer too.
